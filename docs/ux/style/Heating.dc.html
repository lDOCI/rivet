<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Нагрев сопла — Rivet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2dd4bf;text-decoration:none}a:hover{color:#5eead4}
</style>
</helmet>
<div style="position: relative; width: 800px; height: 480px; display: flex; background: #0b0d10; color: #f4f6f8; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <dc-import name="NavRail" active="control" hint-size="88px,480px"></dc-import>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 16px 20px 16px 16px; display: flex; flex-direction: column; gap: 4px">
    <div style="height: 64px; flex: none; display: flex; align-items: center; gap: 14px">
      <a href="Control.dc.html" aria-label="Назад" style="width: 64px; height: 64px; flex: none; border-radius: 20px; background: #15181d; color: #f4f6f8; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
      <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; flex: 1">Сопло</h1>
      <span style="height: 36px; padding: 0 14px; border-radius: 18px; background: rgba(249, 115, 22, 0.13); color: #fdba74; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c2 3 5 5 5 9a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-7.5z"></path></svg>
        нагревается · ещё ~40 с
      </span>
    </div>

    <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: 330px 1fr; gap: 16px; align-items: center">
      <div style="position: relative; width: 320px; height: 320px; justify-self: center">
        <svg width="320" height="320" viewBox="0 0 300 300" role="img" aria-label="Сейчас 187 градусов, цель {{target}}. Перетащите точку, чтобы изменить цель" onPointerDown="{{dragStart}}" onPointerMove="{{dragMove}}" onPointerUp="{{dragEnd}}" onPointerCancel="{{dragEnd}}" style="touch-action: none; cursor: grab">
          <defs>
            <linearGradient id="heat" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#fbbf24"></stop><stop offset="1" stop-color="#f97316"></stop></linearGradient>
          </defs>
          <circle cx="150" cy="150" r="120" fill="none" stroke="#171b21" stroke-width="20" stroke-linecap="round" stroke-dasharray="565.5 754" transform="rotate(135 150 150)"></circle>
          <circle cx="150" cy="150" r="120" fill="none" stroke="url(#heat)" stroke-width="20" stroke-linecap="round" stroke-dasharray="{{currentDash}}" transform="rotate(135 150 150)"></circle>
          <circle cx="{{tx}}" cy="{{ty}}" r="22" fill="#f4f6f8" opacity="{{haloOpacity}}"></circle>
          <circle cx="{{tx}}" cy="{{ty}}" r="15" fill="#0b0d10"></circle>
          <circle cx="{{tx}}" cy="{{ty}}" r="10" fill="#f4f6f8"></circle>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
          <span style="font-size: 76px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums">187°</span>
          <span style="font-size: 16px; color: #98a1ac">сейчас</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px">
        <span style="font-size: 15px; font-weight: 600; color: #98a1ac">Нагреть до</span>
        <div style="display: flex; align-items: center; gap: 10px">
          <button type="button" onClick="{{down}}" aria-label="На 5 градусов меньше" style="width: 84px; height: 84px; flex: none; border: 0; border-radius: 22px; background: #1f242b; color: #f4f6f8; font: 500 36px Inter, system-ui, sans-serif; cursor: pointer">−</button>
          <span aria-live="polite" style="flex: 1; text-align: center; font-size: 56px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">{{target}}°</span>
          <button type="button" onClick="{{up}}" aria-label="На 5 градусов больше" style="width: 84px; height: 84px; flex: none; border: 0; border-radius: 22px; background: #1f242b; color: #f4f6f8; font: 500 36px Inter, system-ui, sans-serif; cursor: pointer">+</button>
        </div>
        <button type="button" onClick="{{openPad}}" style="margin-top: 8px; height: 76px; border: 0; border-radius: 20px; background: #15181d; color: #f4f6f8; font: 600 17px Inter, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M7 9h2"></path><path d="M11 9h2"></path><path d="M15 9h2"></path><path d="M7 13h2"></path><path d="M11 13h2"></path><path d="M15 13h2"></path><path d="M9 17h6"></path></svg>
          Ввести число
        </button>
        <button type="button" onClick="{{off}}" style="height: 64px; border: 0; border-radius: 20px; background: transparent; color: #fb7185; font: 600 16px Inter, system-ui, sans-serif; cursor: pointer">Выключить нагрев сопла</button>
      </div>
    </div>
  </main>
  <sc-if value="{{padOpen}}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-modal="true" aria-label="Ввести температуру сопла" style="position: absolute; inset: 0; background: rgba(5, 6, 8, 0.78); display: flex; align-items: center; justify-content: center">
      <div style="width: 680px; height: 420px; box-sizing: border-box; border-radius: 28px; background: #15181d; padding: 20px; display: grid; grid-template-columns: 240px 1fr; gap: 20px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 15px; font-weight: 600; color: #98a1ac">Сопло, нагреть до</span>
          <span aria-live="polite" style="height: 96px; border-radius: 20px; background: #0b0d10; display: flex; align-items: center; justify-content: center; font-size: 56px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: {{entryInk}}">{{entryLabel}}</span>
          <span style="font-size: 14px; color: {{hintInk}}; text-align: center">{{hint}}</span>
          <div style="flex: 1"></div>
          <button type="button" onClick="{{padOk}}" disabled="{{okDisabled}}" style="height: 80px; border: 0; border-radius: 22px; background: {{okBg}}; color: {{okFg}}; font: 800 19px Inter, system-ui, sans-serif; cursor: pointer">Готово</button>
          <button type="button" onClick="{{padCancel}}" style="height: 64px; border: 0; border-radius: 20px; background: #1f242b; color: #f4f6f8; font: 600 16px Inter, system-ui, sans-serif; cursor: pointer">Отмена</button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
            <button type="button" onClick="{{k.press}}" aria-label="{{k.aria}}" style="border: 0; border-radius: 20px; background: {{k.bg}}; color: #f4f6f8; font: 700 30px Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums; cursor: pointer">{{k.label}}</button>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { target: 240, dragging: false, pad: false, entry: '' };
  }
  targetFromPointer(e) {
    var r = e.currentTarget.getBoundingClientRect();
    var x = e.clientX - (r.left + r.width / 2);
    var y = e.clientY - (r.top + r.height / 2);
    // 0 at the start of the arc (bottom-left), 270 at its end (bottom-right).
    var a = (Math.atan2(y, x) * 180 / Math.PI - 135 + 720) % 360;
    if (a > 270) return null;
    return Math.min(280, Math.max(0, Math.round(a / 270 * 300 / 5) * 5));
  }
  renderVals() {
    var self = this;
    var t = this.state.target;
    var arc = 565.5;
    var max = 300;
    var cur = 187;
    var entry = this.state.entry;
    var padNum = entry === '' ? -1 : parseInt(entry, 10);
    var padValid = padNum >= 0 && padNum <= 280;
    var tf = Math.min(1, t / max);
    var a = (135 + tf * 270) * Math.PI / 180;
    return {
      target: t,
      currentDash: (arc * cur / max).toFixed(1) + ' 754',
      tx: (150 + 120 * Math.cos(a)).toFixed(1),
      ty: (150 + 120 * Math.sin(a)).toFixed(1),
      down: function () { self.setState({ target: Math.max(0, t - 5) }); },
      up: function () { self.setState({ target: Math.min(280, t + 5) }); },
      off: function () { self.setState({ target: 0 }); },
      padOpen: this.state.pad,
      openPad: function () { self.setState({ pad: true, entry: '' }); },
      padCancel: function () { self.setState({ pad: false }); },
      padOk: function () { if (padValid) self.setState({ pad: false, target: padNum }); },
      entryLabel: entry === '' ? '—' : entry + '°',
      entryInk: entry === '' ? '#66707b' : '#f4f6f8',
      hint: padNum > 280 ? 'максимум 280°' : 'от 0 до 280°',
      hintInk: padNum > 280 ? '#fb7185' : '#98a1ac',
      okDisabled: !padValid,
      okBg: padValid ? '#2dd4bf' : '#1f242b',
      okFg: padValid ? '#042f2a' : '#66707b',
      keys: ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', '⌫'].map(function (k) {
        var aria = k === 'C' ? 'Стереть всё' : k === '⌫' ? 'Стереть цифру' : k;
        return {
          label: k, aria: aria, bg: (k === 'C' || k === '⌫') ? '#1f242b' : '#252a31',
          press: function () {
            var e = self.state.entry;
            if (k === 'C') e = '';
            else if (k === '⌫') e = e.slice(0, -1);
            else if (e.length < 3) e = (e === '0' ? '' : e) + k;
            self.setState({ entry: e });
          }
        };
      }),
      haloOpacity: this.state.dragging ? 0.18 : 0,
      dragStart: function (e) {
        var v = self.targetFromPointer(e);
        if (v === null) return;
        if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
        self.setState({ dragging: true, target: v });
      },
      dragMove: function (e) {
        if (!self.state.dragging) return;
        var v = self.targetFromPointer(e);
        if (v !== null && v !== self.state.target) self.setState({ target: v });
      },
      dragEnd: function () { if (self.state.dragging) self.setState({ dragging: false }); }
    };
  }
}
</script>
</body>
</html>
