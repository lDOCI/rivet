<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Печать — Rivet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2dd4bf;text-decoration:none}a:hover{color:#5eead4}
</style>
</helmet>
<div style="width: 800px; height: 480px; display: flex; background: #0b0d10; color: #f4f6f8; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <dc-import name="NavRail" active="home" hint-size="88px,480px"></dc-import>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 16px 20px 16px 16px; display: flex; gap: 22px">

    <div style="width: 300px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px">
      <div style="position: relative; width: 300px; height: 300px">
        <svg width="300" height="300" viewBox="0 0 300 300" role="img" aria-label="Готово {{pct}} процента">
          <defs>
            <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"></stop><stop offset="1" stop-color="{{ringEnd}}"></stop></linearGradient>
          </defs>
          <circle cx="150" cy="150" r="138" fill="none" stroke="#171b21" stroke-width="12"></circle>
          <circle cx="150" cy="150" r="138" fill="none" stroke="url(#ring)" stroke-width="12" stroke-linecap="round" stroke-dasharray="{{dash}}" transform="rotate(-90 150 150)"></circle>
        </svg>
        <div aria-hidden="true" style="position: absolute; inset: 26px; border-radius: 50%; background: radial-gradient(circle at 50% 42%, #222a36 0%, #13161b 72%); display: flex; align-items: center; justify-content: center">
          <svg width="176" height="176" viewBox="0 0 200 200">
            <defs><linearGradient id="pTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d8ff0"></stop><stop offset="1" stop-color="#4466cc"></stop></linearGradient></defs>
            <ellipse cx="100" cy="176" rx="74" ry="12" fill="#0b0d10" opacity="0.6"></ellipse>
            <polygon points="30,100 100,140 100,168 30,128" fill="#2f4fa8"></polygon>
            <polygon points="100,140 170,100 170,128 100,168" fill="#22397e"></polygon>
            <polygon points="100,60 170,100 100,140 30,100" fill="url(#pTop)" opacity="0.95"></polygon>
            <polygon points="100,40 170,80 170,100 100,60 30,100 30,80" fill="none" stroke="#6d8ff0" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.5"></polygon>
          </svg>
        </div>
      </div>
      <span style="max-width: 300px; font-size: 15px; font-weight: 600; color: #c7cdd4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Корпус вентилятора №2</span>
    </div>

    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; padding-top: 6px">
      <span style="align-self: flex-start; height: 34px; padding: 0 14px 0 12px; border-radius: 17px; background: #15181d; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: {{stageColor}}">
        <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: {{stageColor}}; box-shadow: 0 0 0 4px {{stageGlow}}"></span>
        {{stage}}
      </span>
      <span style="margin-top: 10px; font-size: 92px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums">{{pct}}<span style="font-size: 44px; font-weight: 700; color: #98a1ac; letter-spacing: 0">%</span></span>
      <span style="margin-top: 12px; font-size: 22px; font-weight: 700">Осталось 48 мин</span>
      <span style="margin-top: 4px; font-size: 15px; color: #98a1ac">готово в 15:20 · слой 76 из 180</span>

      <div style="margin-top: 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <a href="Heating.dc.html" style="height: 56px; border-radius: 16px; background: #15181d; color: #f4f6f8; display: flex; align-items: center; gap: 10px; padding: 0 14px">
          <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: linear-gradient(135deg, #fbbf24, #f97316)"></span>
          <span style="font-size: 14px; color: #98a1ac; flex: 1">Сопло</span>
          <span style="font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums">240°</span>
        </a>
        <a href="Heating.dc.html" style="height: 56px; border-radius: 16px; background: #15181d; color: #f4f6f8; display: flex; align-items: center; gap: 10px; padding: 0 14px">
          <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: linear-gradient(135deg, #fbbf24, #f97316)"></span>
          <span style="font-size: 14px; color: #98a1ac; flex: 1">Стол</span>
          <span style="font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums">80°</span>
        </a>
      </div>

      <div style="flex: 1"></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <button type="button" onClick="{{toggle}}" style="height: 84px; border: 0; border-radius: 20px; background: #1f242b; color: #f4f6f8; font: 600 15px Inter, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer">
          <sc-if value="{{running}}" hint-placeholder-val="{{ true }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1.3"></rect><rect x="14" y="4.5" width="4" height="15" rx="1.3"></rect></svg></sc-if>
          <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.5 4.8v14.4a1 1 0 0 0 1.5.86l11.6-7.2a1 1 0 0 0 0-1.72L9 3.94a1 1 0 0 0-1.5.86z"></path></svg></sc-if>
          {{toggleLabel}}
        </button>
        <a href="Exclude.dc.html" style="height: 84px; border-radius: 20px; background: #1f242b; color: #f4f6f8; font-size: 15px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect><path d="m14 14 6 6"></path><path d="m20 14-6 6"></path></svg>
          Объекты
        </a>
        <a href="ConfirmStop.dc.html" style="height: 84px; border-radius: 20px; background: rgba(251, 75, 94, 0.12); color: #fb7185; font-size: 15px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3"></rect></svg>
          Стоп
        </a>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"progress":{"editor":"range","min":0,"max":100,"step":1,"default":42},"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { paused: false };
  }
  renderVals() {
    var self = this;
    var p = this.state.paused;
    var pct = Math.round(this.props.progress ?? 42);
    var c = 2 * Math.PI * 138;
    return {
      pct: pct,
      dash: (c * pct / 100).toFixed(1) + ' ' + c.toFixed(1),
      ringEnd: p ? '#fbbf24' : '#2dd4bf',
      running: !p, paused: p,
      toggleLabel: p ? 'Продолжить' : 'Пауза',
      stage: p ? 'На паузе' : 'Печать стенок',
      stageColor: p ? '#fbbf24' : '#2dd4bf',
      stageGlow: p ? 'rgba(251, 191, 36, 0.18)' : 'rgba(45, 212, 191, 0.18)',
      toggle: function () { self.setState({ paused: !p }); }
    };
  }
}
</script>
</body>
</html>
