<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Главная — Rivet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2dd4bf;text-decoration:none}a:hover{color:#5eead4}
</style>
</helmet>
<div style="width: 800px; height: 480px; display: flex; background: #0b0d10; color: #f4f6f8; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <dc-import name="NavRail" active="home" hint-size="88px,480px"></dc-import>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 16px; display: grid; grid-template-columns: 1.45fr 1fr; grid-template-rows: minmax(0, 1fr) 100px; gap: 12px">

    <sc-if value="{{hasLast}}" hint-placeholder-val="{{ true }}">
      <section aria-label="Последняя печать" style="border-radius: 24px; background: #15181d; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; min-height: 0">
        <div aria-hidden="true" style="width: 232px; height: 232px; align-self: center; flex: none; border-radius: 20px; background: radial-gradient(circle at 50% 42%, #232a36 0%, #171b21 72%); display: flex; align-items: center; justify-content: center">
          <svg width="200" height="200" viewBox="0 0 200 200">
            <defs><linearGradient id="mTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d8ff0"></stop><stop offset="1" stop-color="#4466cc"></stop></linearGradient></defs>
            <ellipse cx="100" cy="176" rx="74" ry="12" fill="#0b0d10" opacity="0.6"></ellipse>
            <polygon points="100,40 170,80 100,120 30,80" fill="url(#mTop)"></polygon>
            <polygon points="30,80 100,120 100,168 30,128" fill="#2f4fa8"></polygon>
            <polygon points="100,120 170,80 170,128 100,168" fill="#22397e"></polygon>
            <ellipse cx="100" cy="80" rx="36" ry="20" fill="#1b2d66"></ellipse>
            <ellipse cx="100" cy="80" rx="12" ry="7" fill="#4466cc"></ellipse>
          </svg>
        </div>
        <div style="flex: 1; min-height: 0; display: flex; align-items: center; gap: 12px">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 19px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Корпус вентилятора №2</span>
            <span style="font-size: 14px; color: #98a1ac; white-space: nowrap">вчера · 1 ч 23 мин · PETG</span>
          </div>
          <a href="Printing.dc.html" aria-label="Напечатать снова" style="width: 76px; height: 76px; flex: none; border-radius: 22px; background: #2dd4bf; color: #042f2a; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(45, 212, 191, 0.2)">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.5 4.8v14.4a1 1 0 0 0 1.5.86l11.6-7.2a1 1 0 0 0 0-1.72L9 3.94a1 1 0 0 0-1.5.86z"></path></svg>
          </a>
        </div>
      </section>
    </sc-if>
    <sc-if value="{{noLast}}" hint-placeholder-val="{{ false }}">
      <section aria-label="Начало работы" style="border-radius: 24px; background: #15181d; padding: 26px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 12px">
        <span style="font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Принтер готов</span>
        <span style="font-size: 17px; line-height: 1.5; color: #98a1ac">Отправьте модель из слайсера или выберите файл ниже. Здесь появится последняя печать — повторить её можно одним касанием.</span>
      </section>
    </sc-if>

    <section aria-label="Нагрев" style="border-radius: 24px; background: #15181d; padding: 6px 16px; box-sizing: border-box; display: flex; flex-direction: column">
      <a href="Heating.dc.html" style="flex: 1; display: flex; align-items: center; gap: 14px; color: #f4f6f8; border-bottom: 1px solid #1f242b">
        <span style="position: relative; width: 100px; height: 100px; flex: none">
          <svg width="100" height="100" viewBox="0 0 120 120" aria-hidden="true">
            <circle cx="60" cy="60" r="50" fill="none" stroke="#232831" stroke-width="10" stroke-linecap="round" stroke-dasharray="235.6 314.2" transform="rotate(135 60 60)"></circle>
            <circle cx="60" cy="60" r="50" fill="none" stroke="#4a525c" stroke-width="10" stroke-linecap="round" stroke-dasharray="18.8 314.2" transform="rotate(135 60 60)"></circle>
          </svg>
          <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums">24°</span>
        </span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 700">Сопло</span><span style="font-size: 14px; color: #98a1ac">не нагревается</span></span>
      </a>
      <a href="Heating.dc.html" style="flex: 1; display: flex; align-items: center; gap: 14px; color: #f4f6f8">
        <span style="position: relative; width: 100px; height: 100px; flex: none">
          <svg width="100" height="100" viewBox="0 0 120 120" aria-hidden="true">
            <circle cx="60" cy="60" r="50" fill="none" stroke="#232831" stroke-width="10" stroke-linecap="round" stroke-dasharray="235.6 314.2" transform="rotate(135 60 60)"></circle>
            <circle cx="60" cy="60" r="50" fill="none" stroke="#4a525c" stroke-width="10" stroke-linecap="round" stroke-dasharray="49 314.2" transform="rotate(135 60 60)"></circle>
          </svg>
          <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums">23°</span>
        </span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 700">Стол</span><span style="font-size: 14px; color: #98a1ac">не нагревается</span></span>
      </a>
    </section>

    <a href="Files.dc.html" style="border-radius: 24px; background: #15181d; color: #f4f6f8; display: flex; align-items: center; gap: 16px; padding: 0 20px">
      <span aria-hidden="true" style="width: 56px; height: 56px; flex: none; border-radius: 16px; background: #1f242b; display: flex; align-items: center; justify-content: center; color: #2dd4bf">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h4l2 2.5h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"></path></svg>
      </span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 19px; font-weight: 700">Файлы</span><span style="font-size: 14px; color: #98a1ac">24 на принтере · 3 на USB</span></span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#66707b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
    </a>

    <a href="FilamentLoad.dc.html" aria-label="Заправлен PETG, синий. Нажмите, чтобы сменить пруток" style="border-radius: 24px; background: #15181d; color: #f4f6f8; display: flex; align-items: center; gap: 14px; padding: 0 18px">
      <span aria-hidden="true" style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: #4466cc; box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.12)"></span>
      <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 18px; font-weight: 700">PETG</span><span style="font-size: 14px; color: #98a1ac; white-space: nowrap">заправлен · сменить</span></span>
    </a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lastFile":{"editor":"boolean","default":true},"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    // lastFile off: first run, nothing printed yet.
    var has = this.props.lastFile ?? true;
    return { hasLast: has, noLast: !has };
  }
}
</script>
</body>
</html>
