<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Консоль — Rivet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2dd4bf;text-decoration:none}a:hover{color:#5eead4}
.scroll{overflow-y:scroll;scrollbar-width:thin;scrollbar-color:#4a525c #15181d;padding-right:10px}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-track{background:#15181d;border-radius:4px}
.scroll::-webkit-scrollbar-thumb{background:#4a525c;border-radius:4px}
</style>
</helmet>
<div style="position: relative; width: 800px; height: 480px; display: flex; background: #0b0d10; color: #f4f6f8; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <dc-import name="NavRail" active="tools" hint-size="88px,480px"></dc-import>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<sc-if value="{{kbClosed}}" hint-placeholder-val="{{ true }}">
    <div style="height: 64px; flex: none; display: flex; align-items: center; gap: 14px"><a href="Tools.dc.html" aria-label="Назад" style="width: 64px; height: 64px; flex: none; border-radius: 20px; background: #15181d; color: #f4f6f8; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a><h1 style="margin: 0; flex: 1; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Консоль</h1><button type="button" onClick="{{clear}}" style="height: 64px; padding: 0 18px; border: 0; border-radius: 20px; background: #15181d; color: #c7cdd4; font: 600 15px Inter, system-ui, sans-serif; cursor: pointer">Очистить</button></div>
</sc-if>
    <div role="log" aria-label="Ответы Klipper" class="scroll" style="flex: 1; min-height: 0; border-radius: 20px; background: #070809; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; font: 15px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace">
      <sc-for list="{{log}}" as="l" hint-placeholder-count="6"><span style="color: {{l.c}}">{{l.t}}</span></sc-for>
    </div>
    <sc-if value="{{kbClosed}}" hint-placeholder-val="{{ true }}"><div style="display: flex; gap: 8px; overflow-x: auto"><button type="button" onClick="{{q0}}" style="height: 56px; padding: 0 16px; border: 0; border-radius: 16px; background: #15181d; color: #f4f6f8; font: 600 15px ui-monospace, Menlo, monospace; cursor: pointer">G28</button><button type="button" onClick="{{q1}}" style="height: 56px; padding: 0 16px; border: 0; border-radius: 16px; background: #15181d; color: #f4f6f8; font: 600 15px ui-monospace, Menlo, monospace; cursor: pointer">M105</button><button type="button" onClick="{{q2}}" style="height: 56px; padding: 0 16px; border: 0; border-radius: 16px; background: #15181d; color: #f4f6f8; font: 600 15px ui-monospace, Menlo, monospace; cursor: pointer">QUERY_ENDSTOPS</button><button type="button" onClick="{{q3}}" style="height: 56px; padding: 0 16px; border: 0; border-radius: 16px; background: #15181d; color: #f4f6f8; font: 600 15px ui-monospace, Menlo, monospace; cursor: pointer">STATUS</button><button type="button" onClick="{{q4}}" style="height: 56px; padding: 0 16px; border: 0; border-radius: 16px; background: #15181d; color: #f4f6f8; font: 600 15px ui-monospace, Menlo, monospace; cursor: pointer">SAVE_CONFIG</button></div></sc-if>
    <div style="display: flex; gap: 8px">
      <button type="button" onClick="{{openKb}}" aria-label="Команда, нажмите чтобы ввести" style="flex: 1; height: 60px; border: 0; border-radius: 18px; background: #15181d; box-shadow: inset 0 0 0 2px {{fieldRing}}; color: {{fieldInk}}; display: flex; align-items: center; padding: 0 18px; font: 17px ui-monospace, Menlo, monospace; text-align: left; cursor: text">{{fieldText}}</button>
      <button type="button" onClick="{{send}}" style="width: 120px; border: 0; border-radius: 18px; background: #2dd4bf; color: #042f2a; font: 800 17px Inter, system-ui, sans-serif; cursor: pointer">Отправить</button>
    </div>
<sc-if value="{{kbOpen}}" hint-placeholder-val="{{ false }}">
      <div role="group" aria-label="Клавиатура" style="flex: none; display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{kbRows}}" as="row" hint-placeholder-count="5">
          <div style="display: flex; gap: 6px">
            <sc-for list="{{row.keys}}" as="k" hint-placeholder-count="10">
              <button type="button" onClick="{{k.press}}" aria-label="{{k.aria}}" style="flex: {{k.flex}}; height: 50px; border: 0; border-radius: 12px; background: {{k.bg}}; color: {{k.fg}}; font: 600 19px Inter, system-ui, sans-serif; cursor: pointer">{{k.label}}</button>
            </sc-for>
          </div>
        </sc-for>
      </div>
</sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 800, "height": 480}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kbOpen: false, kbText: '', kbUpper: true, kbSym: false, log: [['> G28', '#5eead4'], ['ok', '#98a1ac'], ['> QUERY_ENDSTOPS', '#5eead4'], ['x:open y:open z:TRIGGERED', '#c7cdd4'], ['> M105', '#5eead4'], ['ok T:24.1 /0.0 B:23.4 /0.0', '#c7cdd4'], ['// Notice: z-offset should not be saved to endstop', '#fcd34d'], ['!! Move out of range: 0.000 0.000 -12.000', '#fb7185']] };
  }

  kbRows(onDone) {
    var self = this, st = this.state;
    var letters = [['1','2','3','4','5','6','7','8','9','0'], ['q','w','e','r','t','y','u','i','o','p'], ['a','s','d','f','g','h','j','k','l','⌫'], ['⇧','z','x','c','v','b','n','m','=','.'], ['#+=','_','-',' ','⏎']];
    var syms = [['1','2','3','4','5','6','7','8','9','0'], ['!','@','#','$','%','&','*','(',')','/'], ['"',"'",';',',','?','+','[',']','<','⌫'], ['⇧','>','{','}','|','~','^','`','=','.'], ['abc','_',':',' ','⏎']];
    var set = st.kbSym ? syms : letters;
    return set.map(function (row) {
      return { keys: row.map(function (k) {
        var special = k === '⌫' || k === '⇧' || k === '⏎' || k === 'abc' || k === '#+=';
        var label = k === ' ' ? 'пробел' : (k.length === 1 && k !== '_' && st.kbUpper && !st.kbSym ? k.toUpperCase() : k);
        return {
          label: label, aria: k === '⌫' ? 'Стереть' : k === '⇧' ? 'Регистр' : k === '⏎' ? 'Готово' : k === ' ' ? 'Пробел' : label,
          flex: k === ' ' ? 4 : (k === '⏎' ? 2 : 1),
          bg: k === '⏎' ? '#2dd4bf' : (k === '⇧' && st.kbUpper) ? '#3a414a' : special ? '#1f242b' : '#252a31',
          fg: k === '⏎' ? '#042f2a' : '#f4f6f8',
          press: function () {
            var t = self.state.kbText;
            if (k === '⌫') self.setState({ kbText: t.slice(0, -1) });
            else if (k === '⇧') self.setState({ kbUpper: !self.state.kbUpper });
            else if (k === '⏎') onDone(t);
            else if (k === '#+=') self.setState({ kbSym: true });
            else if (k === 'abc') self.setState({ kbSym: false });
            else self.setState({ kbText: t + (self.state.kbUpper && !self.state.kbSym ? k.toUpperCase() : k) });
          }
        };
      }) };
    });
  }

  renderVals() {
    var self = this, st = this.state;
    function run(cmd) { if (!cmd) return; self.setState({ log: self.state.log.concat([['> ' + cmd, '#5eead4'], ['ok', '#98a1ac']]), kbText: '', kbOpen: false }); }
    var v = {
      kbOpen: st.kbOpen, kbClosed: !st.kbOpen,
      fieldText: st.kbText ? st.kbText + (st.kbOpen ? '▏' : '') : (st.kbOpen ? '▏' : 'G-code или макрос'),
      fieldInk: st.kbText ? '#f4f6f8' : '#66707b', fieldRing: st.kbOpen ? '#2dd4bf' : 'transparent',
      log: st.log.map(function (l) { return { t: l[0], c: l[1] }; }),
      kbRows: this.kbRows(run),
      openKb: function () { self.setState({ kbOpen: true }); },
      send: function () { run(self.state.kbText); },
      clear: function () { self.setState({ log: [] }); }
    };
    ['G28', 'M105', 'QUERY_ENDSTOPS', 'STATUS', 'SAVE_CONFIG'].forEach(function (c, i) { v['q' + i] = function () { run(c); }; });
    return v;
  }
}
</script>
</body>
</html>
