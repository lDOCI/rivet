<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","control","tools","settings","messages","none"],"default":"home"},"$preview":{"width":88,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active ?? 'home';
    var v = {};
    ['home', 'control', 'tools', 'settings', 'messages'].forEach(function (k) {
      var on = k === active;
      v[k + 'Bg'] = on ? 'rgba(45, 212, 191, 0.13)' : 'transparent';
      v[k + 'Fg'] = on ? '#2dd4bf' : '#7d8792';
      v[k + 'Current'] = on ? 'page' : 'false';
    });
    return v;
  }
}
