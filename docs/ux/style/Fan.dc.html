<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Обдув модели — Rivet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2dd4bf;text-decoration:none}a:hover{color:#5eead4}
</style>
</helmet>
<div style="width: 800px; height: 480px; display: flex; background: #0b0d10; color: #f4f6f8; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <dc-import name="NavRail" active="control" hint-size="88px,480px"></dc-import>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 16px 20px 16px 16px; display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: center; gap: 14px">
        <a href="Control.dc.html" aria-label="Назад" style="width: 64px; height: 64px; flex: none; border-radius: 20px; background: #15181d; color: #f4f6f8; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
        <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Обдув модели</h1>
      </div>
      <span style="margin-top: 18px; font-size: 48px; font-weight: 800; letter-spacing: -0.03em; line-height: 1">{{now}}</span>
      <p style="margin: 0; font-size: 17px; line-height: 1.5; color: #c7cdd4">{{note}}</p>
    </div>
    <div role="radiogroup" aria-label="Обдув" style="display: grid; grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="4">
        <button type="button" role="radio" aria-checked="{{m.checked}}" onClick="{{m.pick}}" style="border: 0; border-radius: 22px; background: {{m.bg}}; color: {{m.fg}}; font-family: Inter, system-ui, sans-serif; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; cursor: pointer">
          <span style="font-size: 21px; font-weight: 700">{{m.label}}</span>
          <span style="font-size: 16px; font-weight: 600; opacity: 0.75">{{m.sub}}</span>
        </button>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'auto' };
  }
  renderVals() {
    var self = this;
    var s = this.state.mode;
    var defs = [['auto', 'Авто', 'по G-code', 'Авто'], ['100', 'Полный', '100%', '100%'], ['50', 'Половина', '50%', '50%'], ['0', 'Выключен', '0%', 'Выкл.']];
    var notes = {
      auto: 'Слайсер сам включает обдув по слоям и материалу. Рекомендуется.',
      '100': 'До конца печати на полную. Помогает мостам и навесам из PLA.',
      '50': 'Половина мощности — компромисс для PETG.',
      '0': 'Без обдува. Для ABS и ASA, чтобы деталь не трескалась.'
    };
    var cur = defs.filter(function (d) { return d[0] === s; })[0];
    return {
      now: cur[3], note: notes[s],
      modes: defs.map(function (d) {
        var on = d[0] === s;
        return {
          label: d[1], sub: d[2], checked: on ? 'true' : 'false',
          bg: on ? '#2dd4bf' : '#15181d', fg: on ? '#042f2a' : '#f4f6f8',
          pick: function () { self.setState({ mode: d[0] }); }
        };
      })
    };
  }
}
</script>
</body>
</html>
