<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Калибровка — Rivet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2dd4bf;text-decoration:none}a:hover{color:#5eead4}
</style>
</helmet>
<div style="width: 800px; height: 480px; display: flex; background: #0b0d10; color: #f4f6f8; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <dc-import name="NavRail" active="settings" hint-size="88px,480px"></dc-import>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 16px 20px 16px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="height: 64px; flex: none; display: flex; align-items: center; gap: 14px">
      <a href="Settings.dc.html" aria-label="Назад" style="width: 64px; height: 64px; flex: none; border-radius: 20px; background: #15181d; color: #f4f6f8; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
      <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Калибровка</h1>
    </div>
    <div style="flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{items}}" as="c" hint-placeholder-count="6">
        <a href="{{c.href}}" style="border-radius: 22px; background: #15181d; color: #f4f6f8; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 0 18px; min-width: 0">
          <span style="display: flex; align-items: center; gap: 10px"><span style="flex: 1; font-size: 19px; font-weight: 700">{{c.title}}</span><span style="height: 28px; padding: 0 10px; border-radius: 14px; background: {{c.tint}}; color: {{c.ink}}; font-size: 13px; font-weight: 600; display: flex; align-items: center; white-space: nowrap">{{c.state}}</span></span>
          <span style="font-size: 14px; color: #98a1ac; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.desc}}</span>
        </a>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    var ok = ['rgba(45, 212, 191, 0.13)', '#5eead4'];
    var never = ['rgba(251, 191, 36, 0.13)', '#fcd34d'];
    var items = [
      ['Карта стола', 'тензодатчик, 5×5 точек · ~4 мин', '0.18 мм · 3 дня', ok, 'BedMesh.dc.html'],
      ['Z-offset', 'высота первого слоя · на тестовой печати', '−0.12 мм', ok, 'ZOffset.dc.html'],
      ['Вибрации', 'input shaper, встроенный датчик · ~5 мин', 'ни разу', never, 'Calibrate.dc.html'],
      ['Ремни', 'сравнить натяжение двух ремней · ~3 мин', 'ни разу', never, 'Calibrate.dc.html'],
      ['Нагрев', 'PID сопла и стола · ~6 мин', '±0.4°', ok, 'Calibrate.dc.html'],
      ['Тензодатчик', 'обнулить, если стол «чувствует» вес · 5 с', 'норма', ok, 'Calibrate.dc.html']
    ];
    return {
      items: items.map(function (i) {
        return { title: i[0], desc: i[1], state: i[2], tint: i[3][0], ink: i[3][1], href: i[4] };
      })
    };
  }
}
</script>
</body>
</html>
