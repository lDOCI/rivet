<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карта стола — Rivet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2fbf62;text-decoration:none}a:hover{color:#5fd788}
</style>
</helmet>
<div style="width: 800px; height: 480px; display: flex; background: #0f1113; color: #f2f4f5; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <dc-import name="NavRail" active="calibrate" hint-size="96px,480px"></dc-import>
  <div style="flex: 1; display: flex; flex-direction: column; min-width: 0">
    <dc-import name="TopBar" mode="ready" hint-size="704px,48px"></dc-import>
    <main style="flex: 1; box-sizing: border-box; padding: 4px 16px 16px; display: flex; gap: 14px; min-height: 0">

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div role="img" aria-label="Карта стола 5 на 5, от минус 0.09 до плюс 0.09 миллиметра" style="width: 380px; height: 380px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 6px; box-sizing: border-box; border-radius: 16px; background: #1a1d21">
          <sc-for list="{{cells}}" as="c" hint-placeholder-count="25">
            <div aria-hidden="true" style="border-radius: 8px; background: {{c.bg}}; color: {{c.fg}}; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums">{{c.label}}</div>
          </sc-for>
        </div>
        <div aria-hidden="true" style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #9aa1a9; width: 380px">
          <span>ниже</span>
          <div style="flex: 1; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #2b6fd6, #3a4048, #e07a2e)"></div>
          <span>выше</span>
        </div>
      </div>

      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 8px">
          <a href="Calibrate.dc.html" aria-label="Назад к калибровкам" style="width: 44px; height: 44px; flex: none; border-radius: 10px; background: #1a1d21; color: #f2f4f5; display: flex; align-items: center; justify-content: center">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
          </a>
          <h1 style="margin: 0; font-size: 20px; font-weight: 700">Карта стола</h1>
        </div>
        <dl style="margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <div style="padding: 10px 12px; border-radius: 12px; background: #1a1d21"><dt style="font-size: 12px; color: #9aa1a9">Разброс</dt><dd style="margin: 2px 0 0; font-size: 20px; font-weight: 700; color: #2fbf62">0.18 мм</dd></div>
          <div style="padding: 10px 12px; border-radius: 12px; background: #1a1d21"><dt style="font-size: 12px; color: #9aa1a9">Профиль</dt><dd style="margin: 2px 0 0; font-size: 20px; font-weight: 700">default</dd></div>
          <div style="padding: 10px 12px; border-radius: 12px; background: #1a1d21"><dt style="font-size: 12px; color: #9aa1a9">Мин / макс</dt><dd style="margin: 2px 0 0; font-size: 16px; font-weight: 600">−0.09 / +0.09</dd></div>
          <div style="padding: 10px 12px; border-radius: 12px; background: #1a1d21"><dt style="font-size: 12px; color: #9aa1a9">Снята</dt><dd style="margin: 2px 0 0; font-size: 16px; font-weight: 600">3 дня назад, 60°</dd></div>
        </dl>
        <p style="margin: 0; font-size: 13px; color: #9aa1a9; line-height: 1.4">До 0.2 мм — норма, компенсация справится. Больше 0.3 мм — подтяните стол.</p>
        <div style="flex: 1"></div>
        <button type="button" style="height: 56px; border: 0; border-radius: 12px; background: #2fbf62; color: #0b1a10; font: 700 16px Inter, system-ui, sans-serif; cursor: pointer">Снять заново · ~3 мин</button>
        <button type="button" style="height: 48px; border: 0; border-radius: 12px; background: #262a30; color: #f2f4f5; font: 600 15px Inter, system-ui, sans-serif; cursor: pointer">Сохранить как профиль</button>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    var mesh = [
      [-0.09, -0.05, -0.02, 0.01, 0.04],
      [-0.06, -0.02, 0.00, 0.03, 0.06],
      [-0.03, 0.00, 0.02, 0.04, 0.07],
      [-0.01, 0.02, 0.04, 0.06, 0.08],
      [0.01, 0.03, 0.05, 0.07, 0.09]
    ];
    function mix(a, b, t) {
      return 'rgb(' + [0, 1, 2].map(function (i) { return Math.round(a[i] + (b[i] - a[i]) * t); }).join(',') + ')';
    }
    var neutral = [58, 64, 72];
    var low = [43, 111, 214];
    var high = [224, 122, 46];
    var cells = [];
    mesh.forEach(function (row) {
      row.forEach(function (v) {
        var t = Math.min(1, Math.abs(v) / 0.09);
        cells.push({
          label: (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(2),
          bg: mix(neutral, v < 0 ? low : high, t),
          fg: '#ffffff'
        });
      });
    });
    return { cells: cells };
  }
}
</script>
</body>
</html>
