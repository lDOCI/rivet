<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Подстройка печати — Rivet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2fbf62;text-decoration:none}a:hover{color:#5fd788}
</style>
</helmet>
<div style="width: 800px; height: 480px; display: flex; background: #0f1113; color: #f2f4f5; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <dc-import name="NavRail" active="home" hint-size="96px,480px"></dc-import>
  <div style="flex: 1; display: flex; flex-direction: column; min-width: 0">
    <dc-import name="TopBar" mode="printing" hint-size="704px,48px"></dc-import>
    <main style="flex: 1; box-sizing: border-box; padding: 4px 16px 16px; display: flex; gap: 12px; min-height: 0">

      <div role="tablist" aria-label="Параметр" style="width: 300px; flex: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)) 56px; gap: 8px">
        <sc-for list="{{params}}" as="p" hint-placeholder-count="4">
          <button type="button" role="tab" aria-selected="{{p.selected}}" onClick="{{p.pick}}" style="box-sizing: border-box; padding: 12px; border-radius: 14px; border: {{p.border}}; background: #1a1d21; color: #f2f4f5; font-family: Inter, system-ui, sans-serif; text-align: left; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer">
            <span style="font-size: 14px; color: #9aa1a9; font-weight: 500">{{p.label}}</span>
            <span style="font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums">{{p.value}}</span>
          </button>
        </sc-for>
        <a href="Printing.dc.html" style="grid-column: 1 / span 2; border-radius: 12px; background: #2fbf62; color: #0b1a10; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center">Готово</a>
      </div>

      <section aria-label="{{current.label}}" style="flex: 1; min-width: 0; box-sizing: border-box; padding: 16px; border-radius: 16px; background: #1a1d21; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: baseline; gap: 10px">
          <h1 style="margin: 0; font-size: 20px; font-weight: 700; flex: 1">{{current.label}}</h1>
          <button type="button" onClick="{{reset}}" style="height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: #262a30; color: #c3c8ce; font: 600 13px Inter, system-ui, sans-serif; cursor: pointer">Сбросить</button>
        </div>
        <span style="font-size: 13px; color: #9aa1a9">{{current.hint}}</span>
        <div style="flex: 1; display: flex; align-items: center; gap: 12px">
          <button type="button" onClick="{{down}}" aria-label="{{downLabel}}" style="width: 96px; height: 96px; flex: none; border: 0; border-radius: 16px; background: #262a30; color: #f2f4f5; font: 600 40px Inter, system-ui, sans-serif; cursor: pointer">−</button>
          <span aria-live="polite" style="flex: 1; text-align: center; font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums">{{current.value}}</span>
          <button type="button" onClick="{{up}}" aria-label="{{upLabel}}" style="width: 96px; height: 96px; flex: none; border: 0; border-radius: 16px; background: #262a30; color: #f2f4f5; font: 600 40px Inter, system-ui, sans-serif; cursor: pointer">+</button>
        </div>
        <div role="radiogroup" aria-label="Шаг" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{steps}}" as="st" hint-placeholder-count="3">
            <button type="button" role="radio" aria-checked="{{st.checked}}" onClick="{{st.pick}}" style="height: 48px; border: 0; border-radius: 10px; background: {{st.bg}}; color: {{st.fg}}; font: 600 15px Inter, system-ui, sans-serif; cursor: pointer">{{st.label}}</button>
          </sc-for>
        </div>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { key: 'z', step: 0, z: 0, speed: 100, flow: 100, fan: 60 };
  }
  renderVals() {
    var self = this;
    var s = this.state;
    function signed(v) { return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(2) + ' мм'; }
    function pct(v) { return v + '%'; }
    var defs = {
      z: { label: 'Z-offset', hint: 'Сопло ближе (−) или дальше (+) от стола. Сохраняется после печати.', steps: [0.01, 0.025, 0.05], unit: ' мм', fmt: signed, lo: -2, hi: 2, base: 0 },
      speed: { label: 'Скорость', hint: 'Множитель скорости всех движений.', steps: [5, 10, 25], unit: '%', fmt: pct, lo: 10, hi: 300, base: 100 },
      flow: { label: 'Поток', hint: 'Сколько пластика подаётся. Меняйте понемногу.', steps: [1, 2, 5], unit: '%', fmt: pct, lo: 50, hi: 150, base: 100 },
      fan: { label: 'Обдув', hint: 'Вентилятор охлаждения детали.', steps: [5, 10, 25], unit: '%', fmt: pct, lo: 0, hi: 100, base: 60 }
    };
    var d = defs[s.key];
    var step = d.steps[s.step];
    function change(dir) {
      return function () {
        var n = {};
        n[s.key] = Math.min(d.hi, Math.max(d.lo, Math.round((s[s.key] + dir * step) * 1000) / 1000));
        self.setState(n);
      };
    }
    var params = ['z', 'speed', 'flow', 'fan'].map(function (k) {
      var on = k === s.key;
      return {
        label: defs[k].label, value: defs[k].fmt(s[k]),
        selected: on ? 'true' : 'false',
        border: on ? '2px solid #4c9aff' : '2px solid transparent',
        pick: function () { self.setState({ key: k, step: 0 }); }
      };
    });
    var steps = d.steps.map(function (v, i) {
      var on = i === s.step;
      return {
        label: 'шаг ' + v + d.unit, checked: on ? 'true' : 'false',
        bg: on ? '#2fbf62' : '#262a30', fg: on ? '#0b1a10' : '#f2f4f5',
        pick: function () { self.setState({ step: i }); }
      };
    });
    return {
      params: params, steps: steps,
      current: { label: d.label, hint: d.hint, value: d.fmt(s[s.key]) },
      down: change(-1), up: change(1),
      downLabel: d.label + ': минус ' + step + d.unit,
      upLabel: d.label + ': плюс ' + step + d.unit,
      reset: function () { var n = {}; n[s.key] = d.base; self.setState(n); }
    };
  }
}
</script>
</body>
</html>
