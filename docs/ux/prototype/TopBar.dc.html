<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Верхняя панель — Rivet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header style="width: 704px; height: 48px; box-sizing: border-box; padding: 0 12px 0 16px; display: flex; align-items: center; gap: 14px; background: #0f1113; font-family: Inter, system-ui, sans-serif; color: #9aa1a9; font-size: 14px">
  <div style="display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1">
    <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; flex: none; background: {{dot}}"></span>
    <span style="color: #f2f4f5; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{label}}</span>
  </div>
  <div style="display: flex; align-items: center; gap: 6px; white-space: nowrap">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5a10 10 0 0 1 14 0"></path><path d="M8.5 16a5 5 0 0 1 7 0"></path><path d="M2 9a15 15 0 0 1 20 0"></path><circle cx="12" cy="19.5" r="0.8"></circle></svg>
    <span>192.168.1.42</span>
  </div>
  <span style="white-space: nowrap; font-variant-numeric: tabular-nums">14:32</span>
  <button type="button" aria-label="Аварийная остановка — удерживать 1 секунду" style="height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: #e5484d; color: #ffffff; font: 700 14px Inter, system-ui, sans-serif; display: flex; align-items: center; gap: 6px; cursor: pointer">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2h8l6 6v8l-6 6H8l-6-6V8z"></path><path d="M12 8v5"></path><path d="M12 16.5v.5"></path></svg>
    <span>СТОП</span>
  </button>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["ready","printing","paused","error","offline"],"default":"ready"},"$preview":{"width":704,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    var mode = this.props.mode ?? 'ready';
    var map = {
      ready: ['#2fbf62', 'Готов'],
      printing: ['#4c9aff', 'Печать · 42%'],
      paused: ['#f5a623', 'Пауза · 42%'],
      error: ['#e5484d', 'Ошибка Klipper'],
      offline: ['#e5484d', 'Нет связи с принтером']
    };
    var m = map[mode] || map.ready;
    return { dot: m[0], label: m[1] };
  }
}
</script>
</body>
</html>
