<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Печать — Rivet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2fbf62;text-decoration:none}a:hover{color:#5fd788}
</style>
</helmet>
<div style="width: 800px; height: 480px; display: flex; background: #0f1113; color: #f2f4f5; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <dc-import name="NavRail" active="home" hint-size="96px,480px"></dc-import>
  <div style="flex: 1; display: flex; flex-direction: column; min-width: 0">
    <dc-import name="TopBar" mode="{{topMode}}" hint-size="704px,48px"></dc-import>
    <main style="flex: 1; box-sizing: border-box; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0">

      <section aria-label="Текущая печать" style="flex: 1; min-height: 0; border-radius: 16px; background: #1a1d21; padding: 16px; box-sizing: border-box; display: flex; gap: 18px">
        <div aria-hidden="true" style="width: 176px; height: 176px; flex: none; border-radius: 12px; background: #262a30; display: flex; align-items: center; justify-content: center; color: #6b737c; font-size: 12px">миниатюра</div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Корпус_вентилятора_№2_PETG_0.2мм.gcode</span>
          <div style="display: flex; align-items: baseline; gap: 12px">
            <span style="font-size: 52px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums">42%</span>
            <span style="font-size: 15px; color: {{stateColor}}; font-weight: 600">{{stateLabel}}</span>
          </div>
          <div role="progressbar" aria-valuenow="42" aria-valuemin="0" aria-valuemax="100" aria-label="Прогресс печати" style="height: 10px; border-radius: 5px; background: #262a30; overflow: hidden">
            <div style="width: 42%; height: 10px; border-radius: 5px; background: {{barColor}}"></div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; font-size: 14px; color: #9aa1a9">
            <div style="display: flex; flex-direction: column; gap: 2px"><span>Слой</span><span style="color: #f2f4f5; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums">76 / 180</span></div>
            <div style="display: flex; flex-direction: column; gap: 2px"><span>Осталось</span><span style="color: #f2f4f5; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums">48 мин</span></div>
            <div style="display: flex; flex-direction: column; gap: 2px"><span>Готово к</span><span style="color: #f2f4f5; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums">15:20</span></div>
          </div>
        </div>
      </section>

      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
        <a href="Temp.dc.html" style="height: 56px; box-sizing: border-box; padding: 8px 12px; border-radius: 12px; background: #1a1d21; color: #9aa1a9; font-size: 12px; display: flex; flex-direction: column; justify-content: center">Сопло<span style="color: #f2f4f5; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums">240° <span style="color: #ff8a3d; font-weight: 500">/ 240°</span></span></a>
        <a href="Temp.dc.html" style="height: 56px; box-sizing: border-box; padding: 8px 12px; border-radius: 12px; background: #1a1d21; color: #9aa1a9; font-size: 12px; display: flex; flex-direction: column; justify-content: center">Стол<span style="color: #f2f4f5; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums">80° <span style="color: #ff8a3d; font-weight: 500">/ 80°</span></span></a>
        <a href="Tune.dc.html" style="height: 56px; box-sizing: border-box; padding: 8px 12px; border-radius: 12px; background: #1a1d21; color: #9aa1a9; font-size: 12px; display: flex; flex-direction: column; justify-content: center">Скорость<span style="color: #f2f4f5; font-size: 16px; font-weight: 600">100%</span></a>
        <a href="Tune.dc.html" style="height: 56px; box-sizing: border-box; padding: 8px 12px; border-radius: 12px; background: #1a1d21; color: #9aa1a9; font-size: 12px; display: flex; flex-direction: column; justify-content: center">Обдув<span style="color: #f2f4f5; font-size: 16px; font-weight: 600">60%</span></a>
      </div>

      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
        <button type="button" onClick="{{togglePause}}" style="height: 60px; border: 0; border-radius: 12px; background: {{pauseBg}}; color: {{pauseFg}}; font: 700 16px Inter, system-ui, sans-serif; cursor: pointer">{{pauseLabel}}</button>
        <a href="Tune.dc.html" style="height: 60px; border-radius: 12px; background: #262a30; color: #f2f4f5; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center">Тюнинг</a>
        <a href="Exclude.dc.html" style="height: 60px; border-radius: 12px; background: #262a30; color: #f2f4f5; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center">Объекты</a>
        <a href="ConfirmStop.dc.html" style="height: 60px; border-radius: 12px; background: #262a30; color: #ff6b70; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center">Отменить</a>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { paused: false };
  }
  renderVals() {
    var paused = this.state.paused;
    var self = this;
    return {
      topMode: paused ? 'paused' : 'printing',
      stateLabel: paused ? 'На паузе' : 'Печатается',
      stateColor: paused ? '#f5a623' : '#4c9aff',
      barColor: paused ? '#f5a623' : '#2fbf62',
      pauseLabel: paused ? 'Продолжить' : 'Пауза',
      pauseBg: paused ? '#2fbf62' : '#262a30',
      pauseFg: paused ? '#0b1a10' : '#f2f4f5',
      togglePause: function () { self.setState({ paused: !paused }); }
    };
  }
}
</script>
</body>
</html>
