<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Главная — Rivet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2fbf62;text-decoration:none}a:hover{color:#5fd788}
</style>
</helmet>
<div style="width: 800px; height: 480px; display: flex; background: #0f1113; color: #f2f4f5; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <dc-import name="NavRail" active="home" hint-size="96px,480px"></dc-import>
  <div style="flex: 1; display: flex; flex-direction: column; min-width: 0">
    <dc-import name="TopBar" mode="ready" hint-size="704px,48px"></dc-import>
    <main style="flex: 1; box-sizing: border-box; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0">

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <a href="Temp.dc.html" aria-label="Сопло 24 градуса, нагрев выключен. Открыть нагрев" style="height: 112px; box-sizing: border-box; padding: 14px 16px; border-radius: 16px; background: #1a1d21; color: #f2f4f5; display: flex; flex-direction: column; justify-content: space-between">
          <span style="font-size: 15px; color: #9aa1a9">Сопло</span>
          <span style="font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums">24°</span>
          <span style="font-size: 14px; color: #9aa1a9">выкл.</span>
        </a>
        <a href="Temp.dc.html" aria-label="Стол 23 градуса, нагрев выключен. Открыть нагрев" style="height: 112px; box-sizing: border-box; padding: 14px 16px; border-radius: 16px; background: #1a1d21; color: #f2f4f5; display: flex; flex-direction: column; justify-content: space-between">
          <span style="font-size: 15px; color: #9aa1a9">Стол</span>
          <span style="font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums">23°</span>
          <span style="font-size: 14px; color: #9aa1a9">выкл.</span>
        </a>
      </div>

      <sc-if value="{{noLastFile}}" hint-placeholder-val="{{ false }}">
      <a href="Files.dc.html" style="flex: 1; min-height: 0; border-radius: 16px; background: #1a1d21; padding: 20px; box-sizing: border-box; display: flex; gap: 20px; align-items: center; color: #f2f4f5">
        <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#9aa1a9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"></path></svg>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 24px; font-weight: 700">Файлы для печати</span>
          <span style="font-size: 15px; color: #9aa1a9">24 на принтере · 3 на USB</span>
        </div>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#9aa1a9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
      </a>
      </sc-if>
      <sc-if value="{{hasLastFile}}" hint-placeholder-val="{{ true }}">
      <section aria-label="Последний файл" style="flex: 1; min-height: 0; border-radius: 16px; background: #1a1d21; padding: 14px; box-sizing: border-box; display: flex; gap: 16px; align-items: center">
        <div aria-hidden="true" style="width: 132px; height: 132px; flex: none; border-radius: 12px; background: #262a30; display: flex; align-items: center; justify-content: center; color: #6b737c; font-size: 12px">миниатюра</div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 13px; color: #9aa1a9">Последний файл</span>
          <span style="font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Корпус_вентилятора_№2_PETG_0.2мм.gcode</span>
          <span style="font-size: 14px; color: #9aa1a9">1 ч 23 мин · 18 г PETG · вчера в 21:40</span>
        </div>
        <a href="Printing.dc.html" style="height: 56px; padding: 0 22px; border-radius: 12px; background: #2fbf62; color: #0b1a10; font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; white-space: nowrap; flex: none">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"></path></svg>
          Печать снова
        </a>
      </section>
      <a href="Files.dc.html" style="height: 76px; box-sizing: border-box; padding: 0 20px; border-radius: 16px; background: #1a1d21; color: #f2f4f5; display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 600">
        <span style="flex: 1">Все файлы</span>
        <span style="font-size: 15px; font-weight: 500; color: #9aa1a9">24 на принтере · 3 на USB</span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9aa1a9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
      </a>
      </sc-if>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lastFile":{"editor":"boolean","default":true},"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    // Tweak "lastFile" off shows the first-run state: nothing printed yet.
    var has = this.props.lastFile ?? true;
    return { hasLastFile: has, noLastFile: !has };
  }
}
</script>
</body>
</html>
