<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">

body{margin:0}
</style>

<nav aria-label="Разделы" style="width: 96px; height: 480px; box-sizing: border-box; background: #1a1d21; display: flex; flex-direction: column; gap: 6px; padding: 10px 8px; font-family: Inter, system-ui, sans-serif; color: #9aa1a9">

  <a href="Main.dc.html" aria-current="{{homeCurrent}}" style="height: 72px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 12px; font-weight: 600; background: {{homeBg}}; color: {{homeFg}}">

    <span>Главная</span>
  </a>
  <a href="Files.dc.html" aria-current="{{filesCurrent}}" style="height: 72px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 12px; font-weight: 600; background: {{filesBg}}; color: {{filesFg}}">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"></path></svg>
    <span>Файлы</span>
  </a>
  <a href="Control.dc.html" aria-current="{{controlCurrent}}" style="height: 72px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 12px; font-weight: 600; background: {{controlBg}}; color: {{controlFg}}">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20"></path><path d="M2 12h20"></path><path d="m9 5 3-3 3 3"></path><path d="m9 19 3 3 3-3"></path><path d="m5 9-3 3 3 3"></path><path d="m19 9 3 3-3 3"></path></svg>
    <span>Управление</span>
  </a>
  <a href="Calibrate.dc.html" aria-current="{{calibrateCurrent}}" style="height: 72px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 12px; font-weight: 600; background: {{calibrateBg}}; color: {{calibrateFg}}">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg>
    <span>Калибровка</span>
  </a>
  <a href="Settings.dc.html" aria-current="{{settingsCurrent}}" style="height: 72px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 12px; font-weight: 600; background: {{settingsBg}}; color: {{settingsFg}}">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    <span>Настройки</span>
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","files","control","calibrate","settings","none"],"default":"home"},"$preview":{"width":96,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active ?? 'home';
    var vals = {};
    ['home', 'files', 'control', 'calibrate', 'settings'].forEach(function (key) {
      var on = key === active;
      vals[key + 'Bg'] = on ? '#262a30' : 'transparent';
      vals[key + 'Fg'] = on ? '#2fbf62' : '#9aa1a9';
      vals[key + 'Current'] = on ? 'page' : 'false';
    });
    return vals;
  }
}
</script>
</body>
</html>
