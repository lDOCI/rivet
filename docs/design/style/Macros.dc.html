<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Макросы — Rivet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2dd4bf;text-decoration:none}a:hover{color:#5eead4}
.scroll{overflow-y:scroll;scrollbar-width:thin;scrollbar-color:#4a525c #15181d;padding-right:10px}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-track{background:#15181d;border-radius:4px}
.scroll::-webkit-scrollbar-thumb{background:#4a525c;border-radius:4px}
</style>
</helmet>
<div style="position: relative; width: 800px; height: 480px; display: flex; background: #0b0d10; color: #f4f6f8; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <dc-import name="NavRail" active="tools" hint-size="88px,480px"></dc-import>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="height: 64px; flex: none; display: flex; align-items: center; gap: 14px"><a href="Tools.dc.html" aria-label="Назад" style="width: 64px; height: 64px; flex: none; border-radius: 20px; background: #15181d; color: #f4f6f8; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a><div role="tablist" aria-label="Макросы" style="flex: 1; height: 64px; border-radius: 20px; background: #15181d; padding: 5px; box-sizing: border-box; display: flex; gap: 4px"><button type="button" role="tab" aria-selected="{{favOn}}" onClick="{{showFav}}" style="flex: 1; border: 0; border-radius: 15px; background: {{favBg}}; color: {{favFg}}; font: 700 17px Inter, system-ui, sans-serif; cursor: pointer">Избранные</button><button type="button" role="tab" aria-selected="{{allOn}}" onClick="{{showAll}}" style="flex: 1; border: 0; border-radius: 15px; background: {{allBg}}; color: {{allFg}}; font: 700 17px Inter, system-ui, sans-serif; cursor: pointer">Все</button></div></div>
    <div class="scroll" style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding-bottom: 16px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
        <sc-for list="{{g.items}}" as="m" hint-placeholder-count="3">
          <div style="min-height: 72px; flex: none; border-radius: 20px; background: #15181d; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 18px">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700; font-family: ui-monospace, Menlo, monospace">{{m.name}}</span><span style="font-size: 14px; color: #98a1ac">{{m.desc}}</span></span>
            <sc-if value="{{m.hasParams}}" hint-placeholder-val="{{ false }}"><a href="MacroRun.dc.html" aria-label="{{m.openAria}}" style="height: 56px; padding: 0 16px; border-radius: 16px; background: #1f242b; color: #f4f6f8; font-size: 15px; font-weight: 700; display: flex; align-items: center">Параметры ›</a></sc-if>
            <sc-if value="{{m.simple}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{m.run}}" aria-label="{{m.runAria}}" style="height: 56px; padding: 0 18px; border: 0; border-radius: 16px; background: rgba(45, 212, 191, 0.13); color: #2dd4bf; font: 800 15px Inter, system-ui, sans-serif; cursor: pointer">Запустить</button></sc-if>
            <button type="button" onClick="{{m.star}}" aria-label="{{m.starAria}}" style="width: 56px; height: 56px; flex: none; border: 0; border-radius: 16px; background: #1f242b; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="{{m.starFill}}" stroke="{{m.starColor}}" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8l2.8 5.7 6.3.9-4.5 4.4 1.1 6.2L12 17.1l-5.6 2.9 1.1-6.2-4.5-4.4 6.3-.9z"></path></svg></button>
          </div>
        </sc-for>
      </sc-for>
    </div>
  </main>
  <sc-if value="{{confirmOpen}}" hint-placeholder-val="{{ false }}">
    <div role="alertdialog" aria-modal="true" aria-labelledby="mt" style="position: absolute; inset: 0; background: rgba(5, 6, 8, 0.78); display: flex; align-items: center; justify-content: center">
      <div style="width: 520px; border-radius: 28px; background: #15181d; padding: 24px; display: flex; flex-direction: column; gap: 12px">
        <h2 id="mt" style="margin: 0; font-size: 24px; font-weight: 800">Запустить {{pending}}?</h2>
        <p style="margin: 0; font-size: 15px; color: #98a1ac">Подтверждение можно выключить: Настройки › Безопасность.</p>
        <div style="display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; margin-top: 6px">
          <button type="button" onClick="{{cancel}}" style="height: 76px; border: 0; border-radius: 20px; background: #1f242b; color: #f4f6f8; font: 700 17px Inter, system-ui, sans-serif; cursor: pointer">Отмена</button>
          <button type="button" onClick="{{confirm}}" style="height: 76px; border: 0; border-radius: 20px; background: #2dd4bf; color: #042f2a; font: 800 17px Inter, system-ui, sans-serif; cursor: pointer">Запустить</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 800, "height": 480}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pending: null, tab: 'fav' }; }
  renderVals() {
    var self = this;
    var fav = [['LOAD_FILAMENT', 'Manual filament loading', false, true], ['AUTO_BED_LEVEL', 'BED_TEMP · EXTRUDER_TEMP · PROFILE', true, true]];
    var all = [['AIR_CIRCULATION_INTERNAL', 'Turn on internal air circulation', false], ['PURGE_FILAMENT', 'выдавить 25 мм', false], ['LCD_ON', 'BACKLIGHT', true], ['PLAY_MIDI', 'FILE', true]];
    function map(list) { return list.map(function (m) { return { name: m[0], desc: m[1], hasParams: m[2], simple: !m[2],
      openAria: m[0] + ': параметры', runAria: 'Запустить ' + m[0], run: function () { self.setState({ pending: m[0] }); },
      starAria: (m[3] ? 'Убрать ' + m[0] + ' из избранных' : 'Добавить ' + m[0] + ' в избранные'),
      starFill: m[3] ? '#fbbf24' : 'none', starColor: m[3] ? '#fbbf24' : '#98a1ac', star: function () {} }; }); }
    return {
      // Two tabs: the starred ones, and all of them (starred ones keep their star).
      groups: [{ items: this.state.tab === 'fav' ? map(fav) : map(fav.concat(all).sort()) }],
      favOn: this.state.tab === 'fav' ? 'true' : 'false', allOn: this.state.tab === 'all' ? 'true' : 'false',
      favBg: this.state.tab === 'fav' ? '#2dd4bf' : 'transparent', favFg: this.state.tab === 'fav' ? '#042f2a' : '#c7cdd4',
      allBg: this.state.tab === 'all' ? '#2dd4bf' : 'transparent', allFg: this.state.tab === 'all' ? '#042f2a' : '#c7cdd4',
      showFav: function () { self.setState({ tab: 'fav' }); }, showAll: function () { self.setState({ tab: 'all' }); },
      confirmOpen: !!this.state.pending, pending: this.state.pending || '',
      cancel: function () { self.setState({ pending: null }); },
      confirm: function () { self.setState({ pending: null }); }
    };
  }
}
</script>
</body>
</html>
