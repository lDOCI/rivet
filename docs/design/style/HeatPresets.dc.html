<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пресеты нагрева — Rivet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2dd4bf;text-decoration:none}a:hover{color:#5eead4}
.scroll{overflow-y:scroll;scrollbar-width:thin;scrollbar-color:#4a525c #15181d;padding-right:10px}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-track{background:#15181d;border-radius:4px}
.scroll::-webkit-scrollbar-thumb{background:#4a525c;border-radius:4px}
</style>
</helmet>
<div style="position: relative; width: 800px; height: 480px; display: flex; background: #0b0d10; color: #f4f6f8; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <dc-import name="NavRail" active="control" hint-size="88px,480px"></dc-import>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="height: 64px; flex: none; display: flex; align-items: center; gap: 14px"><a href="Heating.dc.html" aria-label="Назад" style="width: 64px; height: 64px; flex: none; border-radius: 20px; background: #15181d; color: #f4f6f8; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a><h1 style="margin: 0; flex: 1; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Пресеты нагрева</h1></div>
    <div style="display: grid; grid-template-columns: 90px 1fr 1fr; gap: 10px; padding: 0 22px 0 18px; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: #66707b"><span></span><span style="text-align: center">СОПЛО</span><span style="text-align: center">СТОЛ</span></div>
    <div class="scroll" style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{mats}}" as="m" hint-placeholder-count="4">
        <div style="min-height: 80px; flex: none; border-radius: 20px; background: #15181d; padding: 8px 8px 8px 18px; display: grid; grid-template-columns: 82px 1fr 1fr; gap: 10px; align-items: center">
          <span style="font-size: 18px; font-weight: 800">{{m.name}}</span>
          <div style="display: flex; align-items: center; gap: 6px"><button type="button" onClick="{{m.nDec}}" aria-label="Сопло меньше" style="width: 64px; height: 64px; border: 0; border-radius: 16px; background: #1f242b; color: #f4f6f8; font: 500 28px Inter, system-ui, sans-serif; cursor: pointer">−</button><span style="flex: 1; text-align: center; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums">{{m.n}}°</span><button type="button" onClick="{{m.nInc}}" aria-label="Сопло больше" style="width: 64px; height: 64px; border: 0; border-radius: 16px; background: #1f242b; color: #f4f6f8; font: 500 28px Inter, system-ui, sans-serif; cursor: pointer">+</button></div>
          <div style="display: flex; align-items: center; gap: 6px"><button type="button" onClick="{{m.bDec}}" aria-label="Стол меньше" style="width: 64px; height: 64px; border: 0; border-radius: 16px; background: #1f242b; color: #f4f6f8; font: 500 28px Inter, system-ui, sans-serif; cursor: pointer">−</button><span style="flex: 1; text-align: center; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums">{{m.b}}°</span><button type="button" onClick="{{m.bInc}}" aria-label="Стол больше" style="width: 64px; height: 64px; border: 0; border-radius: 16px; background: #1f242b; color: #f4f6f8; font: 500 28px Inter, system-ui, sans-serif; cursor: pointer">+</button></div>
        </div>
      </sc-for>
      <button type="button" style="min-height: 64px; flex: none; border: 2px dashed #2a3038; border-radius: 20px; background: transparent; color: #98a1ac; font: 700 16px Inter, system-ui, sans-serif; cursor: pointer">+ Добавить материал</button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 800, "height": 480}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { m: [['PLA', 210, 60], ['PETG', 240, 80], ['ABS', 250, 100], ['TPU', 225, 50]] }; }
  renderVals() {
    var self = this;
    function upd(i, j, d, max) { var m = self.state.m.map(function (r) { return r.slice(); }); m[i][j] = Math.max(0, Math.min(max, m[i][j] + d)); self.setState({ m: m }); }
    return { mats: this.state.m.map(function (r, i) { return { name: r[0], n: r[1], b: r[2],
      nDec: function () { upd(i, 1, -5, 350); }, nInc: function () { upd(i, 1, 5, 350); },
      bDec: function () { upd(i, 2, -5, 130); }, bInc: function () { upd(i, 2, 5, 130); } }; }) };
  }
}
</script>
</body>
</html>
