[package]
name = "rivet"
description = "Lightweight touch UI for Klipper/Moonraker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["desktop"]
# Window on macOS / Linux desktop. Software renderer, same fonts: pixel-for-pixel like the device.
desktop = ["slint/backend-winit", "slint/renderer-winit-software", "slint/software-renderer-systemfonts"]
# Printer: draw into /dev/fb0, touch from evdev. Pure Rust, no system libraries (see D-009).
fbdev = ["dep:fbdev-platform"]

[dependencies]
anyhow.workspace = true
model.workspace = true
moonraker.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
slint.workspace = true
png = { version = "0.17", default-features = false }
fbdev-platform = { workspace = true, optional = true }

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
i-slint-backend-testing = "1.18"
