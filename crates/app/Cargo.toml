[package]
name = "rivet"
description = "Lightweight touch UI for Klipper/Moonraker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["desktop"]
# Window on macOS / Linux desktop. Software renderer, same fonts: pixel-for-pixel like the device.
desktop = ["slint/backend-winit", "slint/renderer-winit-software", "slint/software-renderer-systemfonts"]
# Printer: draw into /dev/fb0, touch from evdev. Pure Rust, no system libraries.
fbdev = ["dep:fbdev-platform"]

[dependencies]
# localtime_r: wall-clock times in the printer's timezone.
libc = "0.2"
anyhow.workspace = true
model.workspace = true
moonraker.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
slint.workspace = true
png = { version = "0.17", default-features = false }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
serde.workspace = true
fbdev-platform = { workspace = true, optional = true }

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
i-slint-backend-testing = "1.18"
