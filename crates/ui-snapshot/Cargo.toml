[package]
name = "ui-snapshot"
description = "Render Rivet screens to PNG at 800x480 for review against the prototype"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
rivet = { path = "../app", default-features = false }
model.workspace = true
serde_json.workspace = true
slint = { workspace = true, features = ["renderer-software"] }
png = "0.17"

# Same as fbdev-platform: no fontconfig development package needed to build.
[target.'cfg(target_os = "linux")'.dependencies]
fontique = { version = "0.11", default-features = false, features = ["fontconfig-dlopen"] }
