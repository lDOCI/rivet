[package]
name = "fbdev-platform"
description = "Slint platform for Linux framebuffer (/dev/fbN) + evdev touch, pure Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
tracing.workspace = true
slint = { workspace = true, features = ["renderer-software", "software-renderer-systemfonts"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# Only here to turn on dlopen: Slint's font stack would otherwise link
# libfontconfig, which a static musl binary can't. Fonts are embedded anyway.
fontique = { version = "0.11", default-features = false, features = ["fontconfig-dlopen"] }

# The same Slint core as `slint` (pinned with it): touch targeting walks the
# window's items to find the touch areas around a finger (snap.rs).
[dependencies.i-slint-core]
version = "=1.18.1"
default-features = false
