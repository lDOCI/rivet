component = "TuneForm"
[PrintTune.rows]
r0 = "speed"
r1 = "flow"
r2 = "z"
r3 = "save-z"
r4 = "pa"
r5 = { name = "temps", data = ["sub"] }
r6 = { name = "fans", data = ["sub"] }
r7 = "reset-speed"

