# List pages of the prototype that Rivet builds with FormScreen, and a name for each row.
# tools/gen-forms.py reads the rows from docs/ux/style/<Page>.dc.html; a row without an
# entry here fails the build. The name becomes the row's properties in app.slint
# (`<name>-shown`, `-on`, `-num`, `-value`, ...) and the key of its callbacks.
#   name                               static row: everything from the prototype
#   { name, data = [...] }             title / sub / value / range / tone from live data
#   { name, later = "why" }            hidden until that function exists
# Page keys: component, title = "data" (title from live data), back = false, en (msgids).

[Light]
component = "LightForm"
rows = { r0 = "light", r1 = "brightness", r2 = "on-start" }
en = { "Подсветка" = "Lights", "Яркость" = "Brightness", "Включать при старте" = "Turn on at startup" }

[Speed]
component = "SpeedForm"
[Speed.rows]
r0 = "speed"
r1 = "flow"
r2 = "reset-speed"
r3 = { name = "now", data = ["value"] }

[PrintTune]
component = "TuneForm"
[PrintTune.rows]
r0 = "speed"
r1 = "flow"
r2 = "z"
r3 = "save-z"
r4 = "pa"
r5 = { name = "temps", data = ["sub"] }
r6 = { name = "fans", data = ["sub"] }
r7 = "reset-speed"

[PrintMore]
component = "MoreForm"
[PrintMore.rows]
r0 = { name = "layer-pause", data = ["sub"] }
r1 = { name = "exclude", data = ["sub"], later = "wave 2: the exclude-objects screen (map of the plate)" }
r2 = { name = "camera", later = "the camera view (MJPEG stream) is not built" }
r3 = "light"
r4 = { name = "timelapse", data = ["sub"] }
r5 = "off-after"

[Extruder]
component = "ExtruderForm"
[Extruder.rows]
r0 = { name = "nozzle", data = ["sub", "value"] }
r1 = "length"
r2 = "rate"
r3 = "extrude"
r4 = "retract"
r5 = { name = "filament", later = "wave 2: filament wizard" }
r6 = { name = "load", later = "wave 2: filament wizard" }
r7 = { name = "unload", later = "wave 2: filament wizard" }
r8 = { name = "spools", data = ["sub"] }
r9 = { name = "retraction", data = ["sub"] }
r10 = { name = "dryer", data = ["sub"] }

[Settings]
component = "SettingsForm"
back = false
[Settings.rows]
r0 = { name = "network", data = ["sub"] }
r1 = { name = "screen", data = ["sub"] }
r2 = { name = "lock", data = ["sub"] }
r3 = "sound"
r4 = { name = "language", data = ["sub"] }
r5 = "safety"
r6 = { name = "printers", data = ["sub"] }
r7 = { name = "updates", data = ["sub"] }
r8 = "system"

[FileActions]
component = "FileActionsForm"
title = "data"
[FileActions.rows]
r0 = "queue"
r1 = "rename"
r2 = "move"
r3 = "delete"

[JobQueue]
component = "JobQueueForm"
en = { "Очередь печати" = "Print queue", "Ждать подтверждения между печатями" = "Wait for a tap between prints", "снять деталь со стола" = "to take the part off the bed", "Очистить очередь" = "Clear the queue" }
[JobQueue.rows]
r0 = { name = "jobs", repeat = true }
r1 = { name = "jobs", example = true }
r2 = { name = "queue-run", data = ["title", "sub"] }
r3 = { name = "queue-wait", later = "Moonraker's automatic_transition is a moonraker.conf option, not something a screen can switch" }
r4 = "queue-clear"

[MotionAdvanced]
component = "MotionMoreForm"
[MotionAdvanced.rows]
r0 = "park"
r1 = "home-all"
r2 = "home-xy"
r3 = "home-z"
r4 = "goto"
r5 = { name = "goto-x", data = ["sub", "range"] }
r6 = { name = "goto-y", data = ["sub", "range"] }
r7 = { name = "goto-z", data = ["sub", "range"] }
r8 = "go"
r9 = "jog"
r10 = "jog-xy"
r11 = "jog-z"
r12 = "invert-x"
r13 = "invert-y"
r14 = "invert-z"

[LayerPause]
component = "LayerPauseForm"
[LayerPause.rows]
r0 = { name = "layer-now", data = ["value"] }
r1 = { name = "pause-layer", data = ["range"] }
r2 = { name = "pause-at", data = ["sub"] }
r3 = { name = "pause-next", data = ["sub"] }

[Retraction]
component = "RetractionForm"
[Retraction.rows]
r0 = "retract-length"
r1 = "retract-speed"
r2 = "unretract-extra"
r3 = "unretract-speed"
r4 = "retract-note"

[Dryer]
component = "DryerForm"
[Dryer.rows]
r0 = "dry-material"
r1 = "dry-hours"
r2 = { name = "dry-start", data = ["title", "sub"] }

[Spools]
component = "SpoolsForm"
[Spools.rows]
r0 = { name = "spools", repeat = true }
r1 = { name = "spools", example = true }
r2 = { name = "spools", example = true }
r3 = { name = "spools", example = true }
r4 = "spool-clear"

[Devices]
component = "DevicesForm"
[Devices.rows]
r0 = "power-section"
r1 = { name = "power", repeat = true }
r2 = "pins-section"
r3 = { name = "pins", repeat = true }
