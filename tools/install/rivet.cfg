# Rivet, the touch screen: control it from the console of Fluidd or Mainsail,
# or from your own macros. Added by Rivet's installer; removed by its
# uninstaller (with the [include rivet.cfg] line in printer.cfg).
#
#   RIVET_SCREEN ACTION=OFF       backlight off now (a touch wakes it)
#   RIVET_SCREEN ACTION=ON        backlight on
#   RIVET_SCREEN ACTION=RESTART   start Rivet again

[gcode_macro RIVET_SCREEN]
description: Rivet screen: ACTION=OFF, ON or RESTART
gcode:
    {% set action = params.ACTION|default("ON")|lower %}
    {action_call_remote_method("rivet_screen", action=action)}
