[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/lDOCI/rivet"
rust-version = "1.85"

[workspace.dependencies]
moonraker = { path = "crates/moonraker" }
model = { path = "crates/model" }
fbdev-platform = { path = "crates/fbdev-platform" }

anyhow = "1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2"] }
slint-build = "1.18"
thiserror = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
